ServerName localhost

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /fixtures/server.crt
    SSLCertificateKeyFile /fixtures/server.key

    SetEnv GIT_PROJECT_ROOT /srv/git
    SetEnv GIT_HTTP_EXPORT_ALL
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^localhost(:[0-9]+)?$
    RewriteRule ^/redirect/(.*)$ https://127.0.0.1%1/redirect-target/$1 [R=307,L]
    SetEnvIf Request_URI "^/redirect-target/" redirect_target
    CustomLog /fixtures/redirect-access.log "%U" env=redirect_target
    ScriptAlias /redirect-target/ /usr/lib/git-core/git-http-backend/
    ScriptAlias /git/ /usr/lib/git-core/git-http-backend/

    <Directory "/usr/lib/git-core">
        Options +ExecCGI
        AuthType Basic
        AuthName "Redot Git fixture"
        AuthUserFile /etc/apache2/git.htpasswd
        Require valid-user
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /dev/null common
</VirtualHost>
