name: Bug report
description: Report a problem in the Redot Git Plugin
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. This repository contains only the Git provider; report Redot editor or Version Control UI problems to [Redot Engine](https://github.com/Redot-Engine/redot-engine/issues).

        **Never paste real credentials, private keys, passphrases, or credential-bearing URLs.** Follow SECURITY.md for suspected exposure.
  - type: input
    attributes:
      label: Redot version
      description: Include the engine commit for a custom build.
      placeholder: 26.2.stable.official.4f5b14aba
    validations:
      required: true
  - type: input
    attributes:
      label: Plugin version
      description: Include the Git commit for a development build.
      placeholder: 3.2.1-redot.26.2.1
    validations:
      required: true
  - type: input
    attributes:
      label: System information
      description: Operating system, architecture, and relevant tool versions.
      placeholder: Windows 11 x86-64
    validations:
      required: true
  - type: textarea
    attributes:
      label: Issue description
      description: What happened, what did you expect, and which Git operation was active?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Use a disposable repository and synthetic credentials if authentication is involved.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized logs or fixture
      description: Remove secrets and personal paths before attaching output.
