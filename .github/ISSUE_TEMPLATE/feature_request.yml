name: Feature request
description: Propose an improvement to the Redot Git provider
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        This project implements Redot's existing `EditorVCSInterface`. Requests for new editor UI belong in the [Redot Engine repository](https://github.com/Redot-Engine/redot-engine/issues).
  - type: input
    attributes:
      label: Redot version
      placeholder: 26.2.stable.official.4f5b14aba
    validations:
      required: true
  - type: input
    attributes:
      label: Plugin version
      placeholder: 3.2.1-redot.26.2.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Problem statement
      description: Describe the Git workflow or provider limitation, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed provider behavior
      description: Explain how it fits the existing Redot Version Control interface.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives considered
      description: Include command-line or existing Redot workflows that partly solve the problem.
